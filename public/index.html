<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HQ Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23e5484d%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<!-- styles: every .css under src/client, linked by the server (core/ first, then by path) -->
<!-- styles -->
<!-- three.js, vendored (src/client/vendor/three): the bare "three" its addons import resolves here -->
<script type="importmap">{ "imports": { "three": "/src/client/vendor/three/three.module.min.js" } }</script>
</head>
<body>
<!-- The 3D office (src/client/world/) draws here, behind every panel. -->
<canvas id="world" class="world"></canvas>
<div class="wrap">
  <h1 class="vh">HQ OFFICE</h1>
  <header class="top glass" aria-label="Status">
    <div class="box urgent" id="sWait" title="Questions waiting on you">
      <span class="count">0</span>
      <span class="k">WAITING ON YOU</span>
      <span class="old" id="sOld"><span class="k">OLDEST</span><span class="v">-</span></span>
    </div>
    <div class="right">
      <div class="box strip">
        <div><span class="k">WORKING</span><span class="v" id="sMove">0</span></div>
        <div><span class="k">ON HQ</span><span class="v" id="sHq">0</span></div>
        <div><span class="k">₽ BANK</span><span class="v" id="sBank">0</span></div>
      </div>
      <button class="box fromhq" id="sFrom" type="button" data-tab="updates"><span class="k">FROM HQ</span><span class="v">0 NEW</span></button>
      <div class="box health" id="machines"><span class="k">MACHINES</span><span class="v">-</span></div>
      <div class="btns">
        <button class="btn" id="settingsBtn" type="button" title="Settings" aria-label="Settings">SETTINGS</button>
        <button class="btn theme" id="themeBtn" type="button">THEME</button>
        <button class="btn" id="alerts" type="button">SOUND OFF</button>
      </div>
    </div>
  </header>

  <div class="main" id="main">
    <section class="desk glass" aria-label="Questions">
      <div class="qwrap">
        <div class="qtabs" id="qtabs" role="tablist">
          <button class="tab" type="button" role="tab" data-qtab="questions">QUESTIONS <span class="tag count" id="qtCount" hidden></span></button>
          <button class="tab" type="button" role="tab" data-qtab="messages">MESSAGES <span class="tag new" id="qtUnread" hidden></span></button>
          <button class="tab" type="button" role="tab" data-qtab="work">WORK <span class="tag count" id="qtStalled" hidden></span></button>
          <button class="tab" type="button" role="tab" data-qtab="rooms">ROOMS <span class="tag new" id="qtRooms" hidden></span></button>
        </div>
        <button class="stall" id="stall" type="button" hidden></button>
        <div class="hud" id="hud"></div>
        <div class="box msgs" id="msgs" hidden></div>
        <div class="box work" id="work" hidden></div>
        <div class="box rooms" id="rooms" hidden></div>
      </div>
      <div class="box tell">
        <form class="compose" id="compose">
          <div class="head"><h2>TELL HQ</h2><span class="hint">⌘↩ sends</span><button class="below" id="below" type="button" hidden></button></div>
          <div class="reply" data-composer="note">
            <div class="chips" data-chips="note"></div>
            <textarea id="noteText" rows="1" placeholder="An order, a change of plan, a question."></textarea>
            <div class="acts"><button class="send go" type="submit">SEND</button></div>
          </div>
        </form>
        <div class="lastnote" id="lastNote"></div>
      </div>
    </section>
    <section class="stage">
      <div class="under">
        <div class="box card glass" id="card"></div>
        <section class="box feed glass" id="feed">
          <div class="fhead">
            <div class="tabs" id="feedTabs"></div>
            <button class="fold" id="feedFold" type="button" aria-expanded="true" aria-controls="feedBody" title="Fold">
              <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="body" id="feedBody"></div>
          <div class="body" id="secretsPane" hidden>
            <form class="sform" id="secretForm" autocomplete="off" novalidate>
              <input class="sin name" id="secName" placeholder="NAME_LIKE_THIS" autocomplete="off" spellcheck="false" autocapitalize="characters" maxlength="64" aria-label="Secret name">
              <input class="sin min" id="secMin" type="number" min="1" max="10080" step="1" value="60" autocomplete="off" aria-label="Minutes until it expires"><span class="sk">MIN</span>
              <input class="sin val" id="secValue" type="password" autocomplete="off" placeholder="paste the value" aria-label="Secret value" data-1p-ignore data-lpignore="true" data-bwignore>
              <button class="send go" type="submit">SAVE</button>
            </form>
            <div class="slist" id="secretList"></div>
          </div>
        </section>
      </div>
    </section>
  </div>
</div>

<div class="box settings glass" id="settings" hidden></div>
<script type="module" src="/src/client/main.js"></script>
<!-- features: every src/client/<name>/index.js, loaded by the server after main.js -->
<!-- features -->
</body>
</html>
