<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HQ Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23e5484d%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<!-- styles: every .css under src/client, linked by the server (core/ first, then by path) -->
<!-- styles -->
<!-- three.js, vendored (src/client/vendor/three): the bare "three" its addons import resolves here. "@hq/world" is the
     3D world engine (packages/world), reached only through its public entries. -->
<script type="importmap">{ "imports": { "three": "/src/client/vendor/three/three.module.min.js", "@hq/world": "/packages/world/src/index.js", "@hq/world/model": "/packages/world/src/model/index.js" } }</script>
</head>
<body>
<!-- The 3D office (src/client/world/) draws here, behind every panel. -->
<canvas id="world" class="world"></canvas>
<div class="wrap">
  <h1 class="vh">HQ OFFICE</h1>
  <header class="top glass" aria-label="Status">
    <div class="box urgent" id="sWait" title="Questions waiting on you">
      <span class="count">0</span>
      <span class="k">WAITING ON YOU</span>
      <span class="old" id="sOld"><span class="k">OLDEST</span><span class="v">-</span></span>
    </div>
    <div class="right">
      <div class="box strip">
        <div><span class="k">WORKING</span><span class="v" id="sMove">0</span></div>
        <div><span class="k">ON HQ</span><span class="v" id="sHq">0</span></div>
        <div><span class="k">₽ BANK</span><span class="v" id="sBank">0</span></div>
      </div>
      <button class="box fromhq" id="sFrom" type="button" data-go="updates"><span class="k">FROM HQ</span><span class="v">0 NEW</span></button>
      <div class="box health" id="machines"><span class="k">MACHINES</span><span class="v">-</span></div>
      <div class="btns">
        <button class="btn" id="settingsBtn" type="button" title="Settings" aria-label="Settings">SETTINGS</button>
        <button class="btn theme" id="themeBtn" type="button">THEME</button>
        <button class="btn" id="alerts" type="button">SOUND OFF</button>
      </div>
    </div>
  </header>

  <div class="main" id="main">
    <!-- The stack: every open question, HQ's updates and the rooms, as tall as its content (inbox/). -->
    <section class="desk glass" id="stack" aria-label="Inbox">
      <div class="ihead">
        <h2 class="lbl">INBOX</h2>
        <div class="seg" id="filters" role="tablist" aria-label="Show">
          <button type="button" role="tab" data-filter="needs">Needs you <span class="n" id="fNeeds"></span></button>
          <button type="button" role="tab" data-filter="all">All</button>
          <button type="button" role="tab" data-filter="rooms">Rooms <span class="n" id="fRooms"></span></button>
        </div>
      </div>
      <div class="list" id="hud"></div>
      <button class="below" id="below" type="button" hidden></button>
      <button class="sdock" id="tellDock" type="button" data-open="tell"><span class="plus" aria-hidden="true">+</span><span>Tell HQ…</span></button>
    </section>
    <!-- The reader: one item in full beside the stack, never over it (reader/). -->
    <section class="reader glass" id="reader" aria-label="Reader" hidden>
      <section class="rview tellview" id="tellView" data-view="tell" aria-label="Tell HQ" hidden>
        <header class="rv-head">
          <div class="meta"><b class="rv-kind">TELL HQ</b><span class="hint">An order, a change of plan, a question. ⌘↩ sends.</span><span class="spacer"></span><button class="x" type="button" data-close aria-label="Close">Esc</button></div>
        </header>
        <div class="rv-body">
          <section class="rsec"><h4 class="k">SENT AND ANSWERED</h4><div class="log" id="log"></div></section>
          <section class="rsec secrets">
            <h4 class="k">SECRETS <span id="secCount"></span></h4>
            <form class="sform" id="secretForm" autocomplete="off" novalidate>
              <input class="sin name" id="secName" placeholder="NAME_LIKE_THIS" autocomplete="off" spellcheck="false" autocapitalize="characters" maxlength="64" aria-label="Secret name">
              <input class="sin min" id="secMin" type="number" min="1" max="10080" step="1" value="60" autocomplete="off" aria-label="Minutes until it expires"><span class="sk">MIN</span>
              <input class="sin val" id="secValue" type="password" autocomplete="off" placeholder="paste the value" aria-label="Secret value" data-1p-ignore data-lpignore="true" data-bwignore>
              <button class="send go" type="submit">SAVE</button>
            </form>
            <div class="slist" id="secretList"></div>
          </section>
        </div>
        <footer class="rv-foot">
          <form class="compose" id="compose">
            <div class="reply" data-composer="note">
              <div class="chips" data-chips="note"></div>
              <textarea id="noteText" rows="1" placeholder="An order, a change of plan, a question."></textarea>
              <div class="acts"><button class="send go" type="submit">SEND</button></div>
            </div>
          </form>
          <div class="lastnote" id="lastNote"></div>
        </footer>
      </section>
      <section class="rview workview" id="workView" data-view="work" aria-label="Work board" hidden>
        <header class="rv-head">
          <div class="meta"><b class="rv-kind">WORK BOARD</b><span class="hint" id="workSum"></span><span class="spacer"></span><button class="x" type="button" data-close aria-label="Close">Esc</button></div>
        </header>
        <div class="rv-body"><div class="work" id="work"></div></div>
      </section>
    </section>
    <!-- Bottom right: the worker card, then the pills that open Tell HQ, rooms and the work board in the reader. -->
    <div class="dock" id="dock">
      <div class="box card glass" id="card"></div>
      <div class="pills" id="pills">
        <span class="rpills" id="roomPills"></span>
        <button class="pill glass" id="pWork" type="button" data-open="work">Work board <span class="tag" id="workCount" hidden></span></button>
        <button class="pill glass" id="pTell" type="button" data-open="tell">Tell HQ… <kbd>T</kbd></button>
      </div>
    </div>
  </div>
</div>

<div class="box settings glass" id="settings" hidden></div>
<script type="module" src="/src/client/main.js"></script>
<!-- features: every src/client/<name>/index.js, loaded by the server after main.js -->
<!-- features -->
</body>
</html>
